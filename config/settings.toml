value = "Mediana dei viaggi confrontabili: stessa tratta, stesso tipo di finestra, stessa durata"
editable = "config"

[[setting]]
id = "IMP-03"
name = "Storico minimo per mostrare lo sconto"
value = 6
unit = "settimane"
editable = "config"

[[setting]]
id = "IMP-04"
name = "Migliori offerte nell'albo e nel resoconto AI"
value = 50
editable = "config"

[[setting]]
id = "JOB-01"
name = "Orizzonte di ricerca delle offerte"
value = 90
unit = "giorni"
editable = "config"

[[setting]]
id = "JOB-02"
name = "Esecuzione"
value = "Giornaliera, a coda di priorità"
editable = "config"

[[setting]]
id = "JOB-03"
name = "Riaggiornamento delle partenze entro 4 settimane"
value = 3
unit = "giorni"
editable = "config"

[[setting]]
id = "JOB-04"
name = "Riaggiornamento delle partenze più lontane"
value = 7
unit = "giorni"
editable = "config"

[[setting]]
id = "JOB-05"
name = "Aggiornamento della mappa delle rotte"
value = 30
unit = "giorni"
editable = "config"

[[setting]]
id = "JOB-06"
name = "Tetto di chiamate giornaliere per fonte"
# 0 = fonte spenta. skiplagged = scoperta "ovunque", skiplagged_route = orari per rotta.
# Google Flights resta di riserva: dal runner di GitHub risponde solo in parte.
value = { ryanair = 160, skiplagged = 60, skiplagged_route = 120, google_flights = 0 }
unit = "chiamate"
note = "Valori provvisori, da fissare dopo la prova sul campo"
editable = "config"

[[setting]]
id = "JOB-07"
name = "Fonti a rotta: prezzo massimo di una meta per cercarne gli orari"
value = 150
unit = "€"
note = "Oltre questa cifra un volo non è un'occasione: non si spendono chiamate (allineato a JOB-09)"
editable = "config"

[[setting]]
id = "JOB-08"
name = "Orario del job"
value = "23 5 * * *"
unit = "cron UTC"
note = "Ogni giorno alle 05:23 UTC (06:23 ora italiana, 07:23 con l'ora legale); deve coincidere con .github/workflows/daily.yml"
editable = "config"

[[setting]]
id = "JOB-09"
name = "Prezzo massimo delle offerte"
value = 150
unit = "€"
note = "Andata e ritorno per un adulto: il job scarta le offerte più care, anche quelle già pubblicate"
editable = "config"

[[setting]]
id = "JOB-10"
name = "Fonti a rotta: pausa per le rotte senza voli diretti"
value = 30
unit = "giorni"
note = "Dopo 2 ricerche senza voli diretti di altre compagnie la rotta non si cerca più per questo periodo"
editable = "config"

# --- Configurazione del job (non sono regole, quindi senza ID) ---

[job]
# Aeroporti per cui il job produce data/offers/<aeroporto>.json.
airports = ["VRN", "BGY", "TSF"]
# Regioni con calendario scolastico in config/school/<regione>.toml.
regions = ["veneto"]
# Comune con cui il job classifica le offerte (weekend, weekend+, ponte): vedi config/patrons.toml.
context = "Verona"
# Aeroporti con compagnie oltre a Ryanair, su cui cercare anche con Skiplagged.
skiplagged_airports = ["VRN", "BGY", "TSF"]
market = "it-it"
country = "IT"
language = "it"
currency = "EUR"
# Pausa tra due chiamate alla stessa fonte, in secondi.
pause_seconds = 1.5
# Skiplagged limita le ricerche "ovunque" ravvicinate (errore 429 dopo una quindicina).
skiplagged_pause_seconds = 8
