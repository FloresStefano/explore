# Registro impostazioni (sezione 11 della specifica).
# Ogni regola ha un ID stabile: gli ID non cambiano e non vengono riutilizzati.
# Prefissi: USR utente, FIN finestre, SEL selezione, IMP imperdibili, JOB job.
# Il job legge questo file e lo pubblica come data/settings.json.
# Per cambiare un valore basta modificare `value` della voce, es. SEL-01 = "06:30".
#
# editable: "user" = modificabile nell'app (salvato sul dispositivo),
#           "config" = solo da questo file.

[[setting]]
id = "USR-01"
name = "Comune di residenza"
value = "Verona"
editable = "user"

[[setting]]
id = "USR-02"
name = "Regione per il calendario scolastico"
value = "veneto"
note = "Ricavata da USR-01"
editable = "user"

[[setting]]
id = "USR-03"
name = "Festa del patrono"
value = "05-21"
unit = "MM-GG"
note = "Ricavata da USR-01 (San Zeno per Verona)"
editable = "user"

[[setting]]
id = "USR-04"
name = "Aeroporti di partenza"
value = ["VRN", "BGY", "TSF"]
editable = "user"

[[setting]]
id = "FIN-01"
name = "Notti minime"
value = 1
unit = "notti"
editable = "config"

[[setting]]
id = "FIN-02"
name = "Notti massime"
value = 5
unit = "notti"
editable = "config"

[[setting]]
id = "FIN-03"
name = "Ponte: giorni di ferie massimi"
value = 2
unit = "giorni"
editable = "config"

[[setting]]
id = "FIN-04"
name = "Partenza in giorno lavorativo senza ferie a partire dalle"
value = "18:00"
unit = "ora"
note = "Prima di quest'ora la partenza costa il giorno intero: venerdì-domenica diventa un weekend+"
editable = "config"

[[setting]]
id = "FIN-05"
name = "Chiusure scolastiche"
value = true
note = "Valgono come una festività per qualificare un ponte (vacanze estive escluse); il ponte è marcato \"richiede ferie dei genitori\" se si regge solo su di esse"
editable = "config"

[[setting]]
id = "FIN-06"
name = "Orizzonte di calcolo delle finestre"
value = 365
unit = "giorni"
editable = "config"

[[setting]]
id = "FIN-07"
name = "Weekend: notti massime"
value = 2
unit = "notti"
note = "Senza ferie: venerdì dalle 18:00, sabato, domenica"
editable = "config"

[[setting]]
id = "FIN-08"
name = "Weekend+: giorni di ferie"
value = 1
unit = "giorni"
note = "Speso di venerdì oppure di lunedì, non entrambi; ammessa la partenza del giovedì sera"
editable = "config"

[[setting]]
id = "FIN-09"
name = "Weekend+: notti massime"
value = 3
unit = "notti"
editable = "config"

[[setting]]
id = "FIN-10"
name = "Ponte: notti minime"
value = 2
unit = "notti"
note = "Il ponte unisce due giorni liberi con le ferie: a un estremo una festa infrasettimanale (nazionale, patrono o chiusura scolastica), all'altro un sabato o una domenica. Partire dopo le 18:00 conta come partire il giorno dopo"
editable = "config"

[[setting]]
id = "FIN-11"
name = "Ponte: notti massime"
value = 5
unit = "notti"
note = "Fino a 5 notti anticipando la partenza alle 18:00 del giorno prima"
editable = "config"

[[setting]]
id = "FIN-12"
name = "Precedenza tra i tipi di break"
value = ["ponte", "weekend+", "weekend"]
note = "Se un viaggio rientra in più tipi prevale il primo; senza tipo l'offerta è scartata"
editable = "config"

[[setting]]
id = "FIN-13"
name = "Rientro: conta il giorno di atterraggio"
value = true
note = "Un rientro in un giorno lavorativo, anche dopo mezzanotte, costa un giorno di ferie"
