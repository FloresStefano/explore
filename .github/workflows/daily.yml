name: Job giornaliero

# Sezione 6: raccoglie i prezzi con la coda di priorità, aggiorna storico e file
# pubblicati, li salva nel repository e pubblica tutto su GitHub Pages.
on:
  schedule:
    - cron: "23 5 * * *" # 06:23 ora italiana (07:23 d'estate)
  workflow_dispatch:
  repository_dispatch:
    types: [wake] # sveglia esterna, es. Cron Trigger di Cloudflare
  push:
    branches: [main]
    paths:
      - "job/**"
      - "config/**"
      - "app/**"
      - "tests/**"
      - ".github/workflows/daily.yml"

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  collect:
    # Imposta la variabile di repository RUNNER=self-hosted per usare un runner di casa.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      # Always the latest main, not the commit that triggered the run: a queued run must
      # see the data and the call counters saved by the run before it.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job/requirements.txt
      - run: pip install -r job/requirements.txt
      - run: python -m unittest discover -s tests -t .
      - run: python -m job.run
      - name: Salva i dati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state archive
          git commit -q -m "Dati del $(date -u +%F)" || exit 0
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && exit 0
            git rebase --abort 2>/dev/null || true  # leave a clean tree for the next attempt
            sleep 5
          done
          exit 1

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Compila la web app
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --base-href /explore/
      - name: Componi il sito
        run: |
          mkdir -p _site
          cp -r app/build/web/. _site/
          cp -r data _site/data
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
