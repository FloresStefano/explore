name: Prova fonti

# Piano, passo 1: interroga ogni fonte dal runner di GitHub e salva il resoconto
# in fieldtest/results/. Parte a mano o quando cambia il codice delle fonti.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "job/sources/**"
      - "job/fieldtest.py"
      - ".github/workflows/fieldtest.yml"

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  fieldtest:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job/requirements.txt
      - run: pip install -r job/requirements.txt
      - run: python -m job.fieldtest --label github
      - name: Salva il resoconto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fieldtest/results
          git commit -m "Prova fonti dal runner GitHub" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
